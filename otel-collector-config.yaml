receivers:
  # Prometheus receiver to scrape nginx-exporter metrics
  prometheus:
    config:
      scrape_configs:
        - job_name: 'nginx-exporter'
          scrape_interval: 5s
          static_configs:
            - targets: ['nginx-exporter:9113']
          relabel_configs:
            - source_labels: [__address__]
              target_label: service
              replacement: 'nginx'
            - target_label: exporter
              replacement: 'nginx-prometheus-exporter'

  # OTLP receiver for future direct metric ingestion
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  # Debug exporter - logs metrics to console (stdout/stderr)
  debug:
    verbosity: detailed

  # Prometheus exporter - exposes metrics endpoint for scraping
  prometheus:
    endpoint: "0.0.0.0:8889"
    const_labels:
      environment: "demo"
      demo_type: "nginx-metrics"

service:
  pipelines:
    metrics:
      receivers: [prometheus, otlp]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      exporters: [debug]

