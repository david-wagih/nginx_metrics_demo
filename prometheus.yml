global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape metrics from OpenTelemetry Collector's Prometheus exporter
  - job_name: "otel-collector"
    static_configs:
      - targets: ["collector:8889"]
        labels:
          source: "otel-collector"
          demo: "nginx-metrics"

